<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Move — opening cards</title>
<style>
  :root {
    --surface-0: #f5f4ef; --surface-1: #eceae2; --surface-2: #ffffff;
    --text-primary: #1b1b18; --text-secondary: #5f5e5a; --text-muted: #8b8a83;
    --border: #dcdad1; --border-strong: #c7c5bb;
    --accent-bg: #e6f1fb; --accent-fg: #185fa5;
    --ok-bg: #eaf3de; --ok-fg: #3b6d11;
    --warn-bg: #faeeda; --warn-fg: #854f0b;
    --deep-bg: #eeedfe; --deep-fg: #3c3489;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #1a1a17; --surface-1: #232320; --surface-2: #2b2b28;
      --text-primary: #f2f1ec; --text-secondary: #b4b2a9; --text-muted: #888780;
      --border: #3a3a36; --border-strong: #4a4a45;
      --accent-bg: #0c447c; --accent-fg: #b5d4f4;
      --ok-bg: #27500a; --ok-fg: #c0dd97;
      --warn-bg: #633806; --warn-fg: #fac775;
      --deep-bg: #3c3489; --deep-fg: #cecbf6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
         font-family: var(--sans); line-height: 1.6; padding: 40px 20px; }
  .wrap { max-width: 620px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent-bg);
          color: var(--accent-fg); display: flex; align-items: center; justify-content: center;
          font-weight: 600; font-size: 15px; }
  .brand span { font-size: 13px; font-weight: 500; letter-spacing: 0.02em; color: var(--text-secondary); }
  .seg { display: inline-flex; gap: 2px; background: var(--surface-1); border: 0.5px solid var(--border);
         border-radius: 10px; padding: 3px; margin-bottom: 20px; }
  .seg button { font-family: var(--sans); font-size: 13px; color: var(--text-secondary); background: transparent;
                border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .seg button.on { background: var(--surface-2); color: var(--text-primary); border: 0.5px solid var(--border); }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 2px; }
  .sub { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--surface-2); border: 0.5px solid var(--border);
          border-radius: 12px; padding: 16px 20px; display: flex; gap: 12px; }
  .rank { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--surface-1);
          border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center;
          font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .body { flex: 1; min-width: 0; }
  .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .title { font-size: 16px; font-weight: 500; }
  .tag { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; }
  .tag.low { background: var(--ok-bg); color: var(--ok-fg); }
  .tag.medium { background: var(--warn-bg); color: var(--warn-fg); }
  .tag.high { background: var(--deep-bg); color: var(--deep-fg); }
  .why { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; }
  .chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
  .chain .lbl { font-size: 11px; color: var(--text-muted); margin-right: 4px; }
  .pill { font-size: 11px; font-family: var(--mono); padding: 3px 7px; border-radius: 6px;
          background: var(--surface-1); color: var(--text-secondary); border: 0.5px solid var(--border); }
  .arrow { color: var(--text-muted); }
  button.act { font-family: var(--sans); font-size: 14px; color: var(--text-primary);
           background: transparent; border: 0.5px solid var(--border-strong); border-radius: 8px;
           padding: 8px 14px; cursor: pointer; transition: background .12s; }
  button.act:hover { background: var(--surface-1); }
  button.act:active { transform: scale(0.98); }
  .foot { font-size: 12px; color: var(--text-muted); margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">&#9656;</div><span>First Move</span></div>
  <div class="seg" id="seg"></div>
  <h1 id="greeting"></h1>
  <p class="sub" id="subline"></p>
  <div class="cards" id="cards"></div>
  <p class="foot" id="foot"></p>
</div>

<script>
// Each book's `top` array is verbatim output from scripts/rank.py (the JSON block).
// In Phase 3 this is injected at render time; here it is embedded so the file opens standalone.
const BOOKS = {
  jordan: {
    label: "Jordan · rep", as_of: "2026-09-26",
    rep: { name: "Jordan Rivera", role: "Account Executive", persona: "rep" },
    scanned: "7 open opportunities, 3 calls, and 3 leads",
    top: [
      { key:"deal_gone_quiet", effort:"medium", title:"Acme Corp's deal has gone quiet",
        why:"Acme Corp ($95,000) closes in 4 days and has had no activity in 12 days.",
        skill_chain:["deal-signals","deal-advance-gap","draft-outreach"], button:"Help me re-engage Acme Corp" },
      { key:"call_today_no_prep", effort:"low", title:"You have a call today with no prep",
        why:"Call with Hooli today at 14:00 on a $120,000 deal — no prep logged yet.",
        skill_chain:["account-context","call-prep","stakeholder-map"], button:"Prep my call with Hooli" },
      { key:"pipeline_hygiene", effort:"low", title:"3 deals are missing a next step",
        why:"3 open deals are missing a next step (one is already past its close date).",
        skill_chain:["salesforce-hygiene-check","deal-advance-gap"], button:"Clean up my pipeline" }
    ]
  },
  priya: {
    label: "Priya · rep", as_of: "2026-09-26",
    rep: { name: "Priya Nair", role: "Account Executive", persona: "rep" },
    scanned: "4 open opportunities, 1 call, and 5 leads",
    top: [
      { key:"untouched_new_leads", effort:"low", title:"4 new leads are waiting on a first touch",
        why:"4 new leads created this week have had no first touch yet.",
        skill_chain:["lead-triage","draft-outreach"], button:"Triage my new leads" },
      { key:"deal_gone_quiet", effort:"medium", title:"Wonka's deal has gone quiet",
        why:"Wonka ($80,000) closes in 19 days and has had no activity in 42 days.",
        skill_chain:["deal-signals","deal-advance-gap","draft-outreach"], button:"Help me re-engage Wonka" },
      { key:"pipeline_hygiene", effort:"low", title:"2 deals are missing a next step",
        why:"2 open deals are missing a next step (one is already past its close date).",
        skill_chain:["salesforce-hygiene-check","deal-advance-gap"], button:"Clean up my pipeline" }
    ]
  },
  morgan: {
    label: "Morgan · leader", as_of: "2026-09-26",
    rep: { name: "Morgan Vale", role: "Regional Sales Manager", persona: "leader" },
    scanned: "a team of 4 reps, 2 key deals, and 2 renewals",
    top: [
      { key:"team_pipeline_coverage", effort:"medium", title:"3 reps are below healthy pipeline coverage",
        why:"3 of 4 reps are under 3x coverage — Alex Chen is lowest at 1.3x.",
        skill_chain:["pipeline-review","deal-advance-gap"], button:"Review team pipeline" },
      { key:"deal_needs_review", effort:"medium", title:"MegaCorp's deal is stuck with no close plan",
        why:"MegaCorp ($250,000, Alex Chen) closes in 9 days with no close plan.",
        skill_chain:["deal-review","close-plan"], button:"Review the MegaCorp deal" },
      { key:"forecast_gap", effort:"high", title:"30% of your quota is still uncommitted",
        why:"Commit is $1,400,000 against a $2,000,000 quota — $600,000 (30%) uncovered with 12 days left in Q3 FY27.",
        skill_chain:["forecast-narrative","pipeline-review"], button:"Build my forecast story" }
    ]
  }
};

const TAG = { low: "quick win", medium: "focused effort", high: "deep work" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const chain = c => '<span class="lbl">runs</span>' + c.map((s,i) =>
  (i ? '<span class="arrow">&rsaquo;</span>' : '') + '<span class="pill">' + esc(s) + '</span>').join("");

function render(id) {
  const b = BOOKS[id];
  const first = b.rep.name.split(" ")[0];
  const d = new Date(b.as_of + "T00:00:00").toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
  document.getElementById("greeting").textContent = "Morning, " + first + " — here's where to start";
  document.getElementById("subline").textContent = b.top.length + " plays ranked from your book · " + d;
  document.getElementById("foot").textContent =
    "Ranked by expected value, urgency, and severity across " + b.scanned + ". Every play cites the numbers behind it.";
  document.getElementById("cards").innerHTML = b.top.map((p, i) => `
    <div class="card">
      <div class="rank">${i + 1}</div>
      <div class="body">
        <div class="head">
          <span class="title">${esc(p.title)}</span>
          <span class="tag ${p.effort}">${TAG[p.effort]}</span>
        </div>
        <p class="why">${esc(p.why)}</p>
        <div class="chain">${chain(p.skill_chain)}</div>
        <button type="button" class="act" onclick="fire('${esc(p.button).replace(/'/g,"&#39;")}')">${esc(p.button)} <span class="arrow">&#8599;</span></button>
      </div>
    </div>`).join("");
  document.querySelectorAll("#seg button").forEach(btn => btn.classList.toggle("on", btn.dataset.id === id));
}

document.getElementById("seg").innerHTML = Object.keys(BOOKS).map(id =>
  `<button type="button" data-id="${id}" onclick="render('${id}')">${esc(BOOKS[id].label)}</button>`).join("");

// In Cowork, this hands the button text back to Claude to run the skill chain.
function fire(text) { alert("First Move would now run:\n\n“" + text + "”"); }

render("jordan");
</script>
</body>
</html>
